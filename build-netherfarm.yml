name: Build NetherFarm
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build
        working-directory: NetherFarm-26.1.2
      - uses: actions/upload-artifact@v4
        with:
          name: netherfarm
          path: NetherFarm-26.1.2/build/libs/*.jar
